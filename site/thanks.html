<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thank you · Dropp</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="./" data-brand>Dropp</a>
      <div class="header-actions">
        <label class="sr-only" for="lang">Language</label>
        <select id="lang" class="lang"></select>
      </div>
    </div>
  </header>
  <main class="wrap narrow thanks">
    <div class="thanks-icon" aria-hidden="true">✓</div>
    <h1 data-i18n="thanksTitle">Thank you for your order!</h1>
    <p class="lead" data-i18n="thanksText"></p>
    <p data-i18n="thanksHelp"></p>
    <p><a class="btn" href="./" data-i18n="backHome">← Back to the shop</a></p>
  </main>
  <script src="config.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/legal-content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
